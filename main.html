<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->

	<form action="/submit" method="post">
		<label for="name">Name</label>
		<input type="text" placeholder="Name" required id="name">
		<br><br>
		<label for="email">Email</label>
		<input type="Email" placeholder="Email" required id="email">
		<br><br>
		<h3>Gender</h3>
		<label for="gender_m">Male</label>
		<input type="radio"  required id="gender_m" name="gender">
		<label for="gender_f">Female</label>
		<input type="radio"  required id="gender_f" name="gender">
		<br><br>
        <label for="cars">Car Brands</label>
		<select placeholder="--Please choose an option--" required id="cars" >
			<option>Maruti Suzuki</option>
			<option>Tata Motors</option>
			<option>Mahindra & Mahindra </option>
			<option>Hyundai Motor India</option>
			<option>Kia India </option>
		</select>
		<br><br>
		<label for="age">Age</label>
		<input type="Number" placeholder="Age" required id="age">
		<br><br>
		<br><br>
		<label for="dob">DOB</label>
		<input type="Date"  required id="dob">
		<br><br>
		<br><br>
		<label for="tel">Phone Number</label>
		<input type="Tel" placeholder="xxx-xxx-xxxx"  id="tel">
		<br><br>
		<br><br>
		<label for="password">Password</label>
		<input type="Password" placeholder="Password" required id="password">
		<br><br>
		<br><br>
		<label for="tos">I agree to the TOS</label>
		<input type="Checkbox"  required id="tos">
		<br><br>
		<button type="submit">Submit</button>
		
	</form>

   
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
